<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录页</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,"Microsoft YaHei",sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);padding:20px}
.login{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:36px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.login h1{text-align:center;margin-bottom:10px;color:#333}
.login p{text-align:center;color:#777;margin-bottom:28px;font-size:14px}
.group{margin-bottom:18px}
.group label{display:block;margin-bottom:8px;color:#444;font-size:14px}
.group input{width:100%;padding:13px 14px;border:1px solid #ddd;border-radius:10px;font-size:15px;outline:none;transition:.2s}
.group input:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.15)}
.options{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font-size:14px;color:#666}
.options a{color:#667eea;text-decoration:none}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#667eea;color:#fff;font-size:16px;cursor:pointer;transition:.2s}
button:hover{background:#5568d9;transform:translateY(-1px)}
.register{text-align:center;margin-top:22px;color:#666;font-size:14px}
.register a{color:#667eea;text-decoration:none;font-weight:bold}
.msg{text-align:center;margin-top:14px;font-size:14px;color:#16a34a;display:none}
@media(max-width:480px){.login{padding:28px 22px;border-radius:14px}}
</style>
</head>
<body>
<div class="login">
  <h1>欢迎登录</h1>
  <p>请输入账号信息继续访问</p>
  <form id="loginForm">
    <div class="group">
      <label for="username">用户名</label>
      <input id="username" type="text" placeholder="请输入用户名" required />
    </div>
    <div class="group">
      <label for="password">密码</label>
      <input id="password" type="password" placeholder="请输入密码" required />
    </div>
    <div class="options">
      <label><input type="checkbox" /> 记住我</label>
      <a href="#">忘记密码？</a>
    </div>
    <button type="submit">登录</button>
    <div class="msg" id="msg">登录成功！</div>
  </form>
  <div class="register">还没有账号？<a href="#">立即注册</a></div>
</div>
<script>
const form=document.getElementById("loginForm");
const msg=document.getElementById("msg");
form.addEventListener("submit",e=>{
  e.preventDefault();
  msg.style.display="block";
});
</script>
</body>
</html>
